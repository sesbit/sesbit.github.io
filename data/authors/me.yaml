experience:
  - role: Independent Researcher
    #org: 
    start: 2021
    summary: |
      Lead research projects from ideation through data analysis and publication, working closely with experts 
      across **neuroscience, genetics, AI in healthcare, and global health**. Brings clinical and technical expertise 
      to investigate challenging problems and turn findings into rigorous, peer-reviewed publications. Collaborate 
      with researchers across **leading U.S., European, and Israeli institutions. Nine publications**.
    #button:
      #text: View portfolio
      #url: /
      #icon: hero/arrow-down-tray
  - role: Research Assistant II
    org: Harvard Brain Tissue Resource Center, McLean Hospital
    start: 2019-09-01
    end: 2021-08-31
    summary: |
      Supported neuropathological research through postmortem brain dissection and research operations, 
      developing **Python and VBA automations** to track productivity and generate reports, **saving ~30 minutes 
      per person daily while reducing manual errors**. Used **SQL** to support clinical and specimen operations and 
      fulfill tissue requests for researchers globally. Managed procurement and financial operations for a **$12M 
      NIH-funded  initiative. Educated public and academic audiences** on neuroscience, mental health, and 
      brain donation. 
  - role: Team Lead
    org: Social, Cognitive, and Affective Neuroscience Lab, University of Arizona
    start: 2017-06-01
    end: 2019-09-29
    summary: |
      Led operations for a **$5M U.S. Department of Defense-funded study** investigating cognitive performance 
      under acute stress, managing and training a **team of 10 research assistants** and overseeing complex 
      experimental protocols. Built **REDCap databases and Python workflows** to support data collection and 
      processing, conducted statistical analyses in R, and translated findings into reports, publications, and **15+ 
      conference posters**.
  - role: Research Assistant I
    org: Wiens Lab, University of Arizona
    start: 2016-09-01
    end: 2017-06-01
    summary: |
      Conducted **population genomic and ecological research** on Oedipodea grasshopper species, applying 
      RAD-seq workflows from DNA extraction through library preparation and sequencing. Used **R and ArcGIS** for 
      spatial and climatic modeling, integrating species distributions and environmental data to investigate the 
      factors shaping divergence between closely related species. 

      
     

