bio: |
  Simon lives at the intersection of medicine and technology,
  bringing a physician's instinct for human connection together with
  a scientist's instinct for rigor. He has spent his career chasing 
  hard problems across neuroscience, genetics, AI-assisted diagnostics, and global health -
  driven by a love of learning, asking questions, and finding creative solutions.
  Off the clock, he is running trails, exploring caves, and skiing hard,
  carrying that same restless curiosity into everything else he does.

