      I led a research team through a multi-phase, US-Department of Defense-funded study on cognitive performance under acute stress - 
      hiring, training, and overseeing staff while building the database and processing scripts that kept everything running smoothly.
      I drove the project from design through delivery, reporting results to the US-Department of Defense.
  - role: Research Assistant I
    org: Wiens Lab, University of Arizona
    start: 2016-09-01
    end: 2017-06-01
    summary: |
      I contributed to genomics research projects — executing wetlab SOPs for DNA analysis and building computational models
      to explore how environmental factors shape species over time.

      
     

